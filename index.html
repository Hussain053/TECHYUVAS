<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="description" content="A private, rule-based tool for exploring digital habits and self-reported well-being patterns." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f1" />
    <title>MindTrace — Personal wellness patterns</title>
    <script>
      try {
        const saved = JSON.parse(localStorage.getItem('mindtrace.app-data.v2') || 'null');
        const theme = saved?.preferences?.theme;
        document.documentElement.dataset.theme = theme === 'light' || theme === 'dark'
          ? theme
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme =
          matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
